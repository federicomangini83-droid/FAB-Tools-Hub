<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Table to RAG JSON · FAB Tools Hub</title><link rel="stylesheet" href="../../assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script></head><body><header class="topbar"><nav class="nav"><a class="brand" href="../../">FAB Tools Hub</a><small>Table to RAG JSON</small></nav></header><section class="tool-head"><div class="wrap"><a class="back" href="../../">← Back to tools</a><h1>Table to RAG JSON</h1><p>One JSON chunk for each populated row. Processing takes place entirely in the browser.</p></div></section><main class="wrap"><div class="panel"><div class="drop" id="drop"><strong>Select or drop an Excel/CSV file</strong><br><br><input id="file" type="file" accept=".xlsx,.xls,.xlsm,.csv"></div><div class="form-row"><div class="field"><label for="sheet">Worksheet</label><select id="sheet" disabled><option>First worksheet</option></select></div><div class="field"><label for="prefix">JSON file prefix</label><input id="prefix" value="TABLE_DATA"></div></div><div class="field"><label for="promptDescription">Document description / Prompt</label><textarea id="promptDescription" rows="5" style="width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:8px;resize:vertical" placeholder="Describe the structure, meaning and intended usage of this table. This text will be included in every generated JSON file."></textarea></div><div class="field" style="margin-top:12px"><label for="sourceName">Source name (optional)</label><input id="sourceName" placeholder="e.g. PCAF Conversion Factors 2026"></div><div class="field" style="margin-top:12px"><label><input type="checkbox" id="prependPrompt" checked> Include prompt inside document_content for better RAG retrieval</label></div><div class="actions"><button class="btn" id="convert">Create ZIP</button><button class="btn secondary" id="reset">Reset</button></div><div id="status" class="status"></div><p class="note">Output format: <code>{"id":"1","table":"source.xlsx","document_content":"Column: value; ..."}</code></p></div><div id="storageMount"></div></main><footer>FAB Tools Hub</footer><script src="../../assets/js/common.js"></script><script src="../../assets/js/github-storage.js"></script><script src="app.js"></script></body></html>
